spring.main.allow-bean-definition-overriding=true

# ==============================================================================
# SERVER CONFIGURATION
# ==============================================================================
server.port=9297
server.servlet.context-path=/appzillonbankingcm
management.endpoints.web.exposure.include=*
spring.codec.max-in-memory-size=16
server.error.include-stacktrace=never

# ==============================================================================
# 1. PRIMARY LOCALHOST DATASOURCE (PostgreSQL - tb_cm_* tables)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=CAGL-CM-POSTGRES-LOCAL
spring.datasource.hikari.idle-timeout=30000

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernateDialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.ddlAuto=update
spring.jpa.properties.showSQL=true
spring.jpa.properties.formatSQL=true

# ==============================================================================
# 2. SECONDARY LOCALHOST DATASOURCE (CDH Central Data Hub gk_unified_data)
# ==============================================================================
cdh.datasource.url=jdbc:postgresql://localhost:5432/postgres
cdh.datasource.username=postgres
cdh.datasource.password=postgres
cdh.datasource.driver-class-name=org.postgresql.Driver

cdh.datasource.maximumPoolSize=5
cdh.datasource.minimumIdle=2
cdh.datasource.poolName=CAGL-CM-CDH-LOCAL
cdh.datasource.idleTimeOut=30000

cdh.jpa.properties.ddlAuto=update
cdh.jpa.properties.showSQL=true
cdh.jpa.properties.formatSQL=true
cdh.jpa.properties.hibernateDialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# 3. LOCALHOST MICROSERVICES & API GATEWAY ENDPOINTS
# ==============================================================================
url.kyc.service=http://localhost:9288/appzillonbankingkyc
url.dms.service=http://localhost:9287/appzillonbankingdocument
url.cbs.service=http://localhost:9286/appzillonbankingcbs
url.kendra.service=http://localhost:9290/appzillonbankingkendra

# ==============================================================================
# 4. LOGGING CONFIGURATION
# ==============================================================================
logging.level.com.iexceed.appzillonbanking.cagl.cm.*=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
