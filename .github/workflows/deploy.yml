name: CI/CD - Build & Deploy CAGL Service to Free Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Microservice to build and deploy'
        required: true
        default: 'AppzillonBanking-CM'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Shared Libraries (dependencies-lib)
      run: mvn clean install -DskipTests -f dependencies-lib/pom.xml

    - name: Build Target Microservice
      run: mvn clean package -DskipTests -f apz_java_microservices/${{ github.event.inputs.service_name || 'AppzillonBanking-CM' }}/pom.xml

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and Push Docker Image
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        build-args: |
          SERVICE_NAME=${{ github.event.inputs.service_name || 'AppzillonBanking-CM' }}
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/cagl-backend:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/cagl-backend:${{ github.sha }}

    - name: Trigger Free Cloud Deployment (Render Deploy Hook)
      if: github.ref == 'refs/heads/main'
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
